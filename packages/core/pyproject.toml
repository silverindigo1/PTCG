[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokearb-core"
version = "0.1.0"
description = "PokeArb engines. Pure Python, no I/O, so the backtester cannot read the present."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["pokearb_core*"]
