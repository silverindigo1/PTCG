services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pokearb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: pokearb
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mounted as individual files, not directories: the postgres entrypoint
      # only executes *.sql sitting directly in this folder and silently skips
      # subdirectories. Numeric prefixes fix the order, which matters because
      # the seed rows reference schema objects.
      - ./migrations/versions/0001_initial.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./migrations/versions/0002_pipeline_and_provenance.sql:/docker-entrypoint-initdb.d/02_pipeline.sql:ro
      - ./migrations/versions/0003_manual_import_verification.sql:/docker-entrypoint-initdb.d/03_manual_import.sql:ro
      - ./seed/sources.sql:/docker-entrypoint-initdb.d/04_sources.sql:ro
      - ./seed/policy.sql:/docker-entrypoint-initdb.d/05_policy.sql:ro
      - ./seed/condition_priors.sql:/docker-entrypoint-initdb.d/06_condition_priors.sql:ro
      # Synthetic demonstration sources. Labelled dataset='synthetic_demo' and
      # kept apart from production rows by a database trigger.
      - ./seed/demo/sources.sql:/docker-entrypoint-initdb.d/07_demo_sources.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokearb"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["5432:5432"]

  cache:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes: [redisdata:/data]
    ports: ["6379:6379"]

  api:
    build: {context: ., dockerfile: services/api/Dockerfile}
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
      cache: {condition: service_started}
    ports: ["8000:8000"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build: {context: ., dockerfile: services/worker/Dockerfile}
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
      cache: {condition: service_started}
    command: python -m app.run

volumes:
  pgdata:
  redisdata:
