name: PokeArb daily scan

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pokearb-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan the market
        run: python pokearb_scan.py --out site --data data --alerts alerts
      - name: Keep the single-card check on the site
        run: if [ -f index.html ]; then cp index.html site/check.html; fi
      - name: Save the price history
        run: |
          git config user.name "pokearb-scan"
          git config user.email "pokearb-scan@users.noreply.github.com"
          git add data
          git commit -m "Scan $(date -u +%F)" || echo "nothing to save"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Alert on new buy signals
        if: hashFiles('alerts/new.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "PokeArb new buy signals $(date -u +%F)" --body-file alerts/new.md
